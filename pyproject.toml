[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kickgen"
version = "0.1.0"
description = "LLM-driven kick drum generator for FL Studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/kickgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
